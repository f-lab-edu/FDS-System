events {
    worker_connections 1024;
}

http {
    upstream transfer_api {
        # Round-robin 로드 밸런싱 (기본값)
        # least_conn; # 최소 연결 방식으로 변경 가능
        # ip_hash;    # 세션 유지 필요시
        
        server transfer-api-1:8080 max_fails=3 fail_timeout=30s;
        server transfer-api-2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream fds_api {
        server fds-api-1:8082 max_fails=3 fail_timeout=30s;
        server fds-api-2:8082 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # 로깅
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # 클라이언트 요청 크기 제한
        client_max_body_size 10M;

        # Timeout 설정
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Transfer API 프록시
        location /api/transfers {
            rewrite ^/api(/.*) $1 break;  # /api/transfers → /transfers
            proxy_pass http://transfer_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Health check 제외
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # FDS API 프록시
        location /api/fds {
            proxy_pass http://fds_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator Health Check (LB용)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status (모니터링용)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker 네트워크
            deny all;
        }
    }
}
