# ============================================
# HA(High Availability) 운영 시뮬레이션
# ============================================
# 기본 docker-compose.yml 은 개발용 단일 노드.
# 이 파일은 다음 합쳐 띄운다:
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d
# 변경점:
#   - Kafka 1 → 3 브로커 (KRaft), RF=3 토픽
#   - PostgreSQL 1 → primary + replica (streaming replication)
#   - Redis 1 → master + replica + sentinel 3대 (자동 failover)
#   - transfer-api / fds-api 가 HA 엔드포인트(또는 sentinel) 참조

services:
  # ============================================
  # Kafka 멀티 브로커 (KRaft, RF=3)
  # ============================================
  kafka:
    container_name: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: kafka-2
    restart: unless-stopped
    ports: ["9095:9094"]
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "aaaaaaaaaaaaaaaaaaaaaa"
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: kafka-3
    restart: unless-stopped
    ports: ["9096:9094"]
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "aaaaaaaaaaaaaaaaaaaaaa"
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  init-topics:
    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic transfer-complete-events --partitions 6 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic transfer-transaction-events --partitions 6 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic fds-analysis-results --partitions 6 --replication-factor 3 --config min.insync.replicas=2 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic suspicious-patterns --partitions 6 --replication-factor 3 --config min.insync.replicas=2 &&
      echo 'HA topics created (RF=3, min.isr=2)'
      "

  # ============================================
  # PostgreSQL streaming replication
  # ============================================
  postgres:
    container_name: postgres-primary
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c hot_standby=on
        -c archive_mode=on
        -c archive_command='/bin/true'

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass1234
      PGUSER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -vP -W -R; do
        echo 'Waiting for primary...'
        sleep 2s
      done
      chmod 0700 /var/lib/postgresql/data
      postgres -c hot_standby=on
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================
  # Redis master + replica + sentinel × 3
  # ============================================
  redis:
    container_name: redis-master
    command: redis-server --appendonly yes --replica-read-only no

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    restart: unless-stopped
    ports: ["6380:6379"]
    depends_on:
      redis:
        condition: service_healthy
    command: redis-server --replicaof redis 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    restart: unless-stopped
    ports: ["26379:26379"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: >
      sh -c '
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel monitor mymaster redis 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      redis-sentinel /tmp/sentinel.conf
      '

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    restart: unless-stopped
    ports: ["26380:26379"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: >
      sh -c '
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel monitor mymaster redis 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      redis-sentinel /tmp/sentinel.conf
      '

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    restart: unless-stopped
    ports: ["26381:26379"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: >
      sh -c '
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      sentinel monitor mymaster redis 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      redis-sentinel /tmp/sentinel.conf
      '

volumes:
  kafka_2_data:
  kafka_3_data:
  pg_replica_data:
