server:
  shutdown: graceful

spring:
  application:
    name: transfer-relay
  lifecycle:
    timeout-per-shutdown-phase: 60s   # in-flight Batch step 종료 대기 여유

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/transfer
    username: postgres
    password: pass1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

server:
  port: 8081

kafka-config:
  bootstrap-servers: host.docker.internal:9094
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8085
  num-of-partitions: 3
  replication-factor: 1

kafka-producer-config:
  keySerializer: org.apache.kafka.common.serialization.StringSerializer
  valueSerializer: io.confluent.kafka.serializers.KafkaAvroSerializer
  compressionType: lz4
  acks: "1"
  batchSize: 65536
  batchSizeBoostFactor: 1
  lingerMs: 5
  requestTimeoutMs: 1000
  retryCount: 0

app:
  outbox:
    relay:
      chunkSize: 1000
      threadPoolSize: 8
      fixedDelayMs: 1000
      initialDelayMs: 5000
      timeoutSeconds: 10
      maxAttempts: 5
      baseBackoffMs: 5000
      sendingTimeoutSeconds: 300

  kafka:
    topics:
      transfer-events: transfer-transaction-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${PARTITION_ID:unknown}
  tracing:
    enabled: false
